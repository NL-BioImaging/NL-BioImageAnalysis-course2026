# See docs at: https://mystmd.org/guide/frontmatter
version: 1

# Author and affiliation definitions live in book/authors.yml.
# Pages refer to people by their short id, e.g. `authors: [mpaul]`.
extends:
  - ./book/authors.yml

project:
  id: 1173d565-c15a-4b0b-b337-a47ddacbfd7a
  title: NL-BioImaging Advanced Image Analysis Course 2026
  description: Course website
  keywords:
    - bioimage analysis
    - microscopy
  # Default authors for every page; a page can override this in its own
  # front matter. Ids are defined in book/authors.yml.
  github: https://github.com/NL-BioImaging/NL-BioImageAnalysis-course2026
  # To autogenerate a Table of Contents, run "jupyter book init --write-toc"
  toc:
    - file: index.md
    - title: Preparation
      file: preparation/preparation.md
    - title: Program
      children:
      - file: day_1/README
        title: Day 1
        children:
        - file: day_1/image_processing/Image_processing_concepts_pt1.ipynb
          title: Notebook - Image processing concepts (1/3)
        - file: day_1/image_processing/Image_processing_concepts_pt1_answers.ipynb
          title: Notebook - Image processing concepts (1/3) answers to exercises
        - file: day_1/image_processing/Image_processing_concepts_pt2.ipynb
          title: Notebook - Image processing concepts (2/3)
        - file: day_1/image_processing/Image_processing_concepts_pt2_answers.ipynb
          title: Notebook - Image processing concepts (2/3) answers to exercises
        - file: day_1/image_processing/Image_processing_concepts_pt3.ipynb
          title: Notebook - Image processing concepts (3/3)
        - file: day_1/image_processing/Image_processing_concepts_pt3_answers.ipynb
          title: Notebook - Image processing concepts (3/3) answers to exercises
      - title: Day 2
        file: day_2/README
        children:
        - title: OMERO
          file: day_2/omero/README.md
          children:
          - file: day_2/omero/extra_work       
        - title: Deep learning for image analysis
          file: day_2/deep_learning/README.md
          children:
          - file: day_2/deep_learning/01_stardist.ipynb
            title: StarDist
          - file: day_2/deep_learning/01_stardist_answers.ipynb
            title: StarDist answers to exercises
          - file: day_2/deep_learning/02_cellpose.ipynb
            title: Cellpose
          - file: day_2/deep_learning/02_cellpose_answers.ipynb
            title: Cellpose answers to exercises
          - file: day_2/deep_learning/03_spotiflow.ipynb
            title: Spotiflow
          - file: day_2/deep_learning/03_spotiflow_answers.ipynb
            title: Spotiflow answers to exercises
      - file: day_3/README
        title: Day 3
        children:
        - file: other/ResearchCloud
        - name: "napari"
          file: day_3/napari/napari.ipynb
          children:
          - file: day_3/napari/00_napari_basics.ipynb
            title: napari basics
          - file: day_3/napari/01_napari_segmentation.ipynb
            title: napari segmentation
          - file: day_3/napari/02_napari_analysis.ipynb
            title: napari analysis
        - title: BiaPy
          file: day_3/biapy/README.md
        - title: Preparing data and training an AI model
          file: day_3/AI_training/README.md
          children:
          - file: day_3/AI_training/00_data_collection_stardist.ipynb
            title: Collecting training data from IDR
          - file: day_3/AI_training/01_training_instance_segmentation.ipynb
            title: Training instance segmentation with BiaPy
          - file: day_3/AI_training/02_training_image_to_image.ipynb
            title: Training image-to-image with BiaPy
          - file: day_3/AI_training/03_training_cellpose.ipynb
            title: Fine-tuning Cellpose-SAM
      - file: day_4/README
        title: Day 4
    
site:
  template: book-theme
  options:
    favicon: images/favicon.ico
    logo: images/nlbio.jpg
    logo_text: "NL-BioImaging Advanced Image Analysis Course 2026"
    style: book/custom-style.css
    folders: true
    # Readers keep the light/dark toggle; book/custom-style.css themes
    # both modes. book-theme has no option for the default mode, so the
    # deploy workflow (.github/workflows/deploy.yml) patches it to light.
    nav_title: "NL-BioImaging Advanced Image Analysis Course 2026"
